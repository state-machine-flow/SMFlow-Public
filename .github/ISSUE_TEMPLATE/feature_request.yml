name: Feature request
description: Suggest a node, a target, or a capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build?
      description: Describe the control problem, not just the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like SMFlow to do?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How are you handling it today?
